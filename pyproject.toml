[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "typeaudit"
version = "0.1.0"
description = "Taxonomic type-material metadata audit toolkit"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
ncbi = ["biopython>=1.79"]

[project.scripts]
typeaudit-audit = "typeaudit.audit:main"
typeaudit-gate = "typeaudit.gate:main"
typeaudit-numbers = "typeaudit.numbers:main"
typeaudit-gaps = "typeaudit.gaps:main"

[tool.setuptools.packages.find]
where = ["src"]
